name: Fork hygiene

on:
  pull_request:
    branches: [kk-mesh-shader, main]
  push:
    branches: [kk-mesh-shader]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run KosmicKrisp fork hygiene gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          python3 scripts/preflight_kk.py --check-hygiene --ci --base "$BASE"
