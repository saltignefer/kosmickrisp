name: Fork hygiene

on:
  pull_request:
    branches: [kk-mesh-shader, main]
  push:
    branches: [kk-mesh-shader]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Run KosmicKrisp fork hygiene gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BASE="$BEFORE"
            elif git rev-parse --verify --quiet origin/main >/dev/null; then
              BASE="$(git merge-base HEAD origin/main)"
            else
              echo "ERROR: cannot determine push base commit (before=${BEFORE}); refusing to fall back to HEAD~1" >&2
              exit 1
            fi
          fi
          python3 scripts/preflight_kk.py --check-hygiene --ci --base "$BASE"
